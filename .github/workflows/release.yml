name: release

# Attach package tarballs to a GitHub Release. The Pages workflow only has
# contents: read, so it cannot publish these packages.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Pack core and games
        run: npm pack --workspace @gizclaw/mvg-core --workspace @gizclaw/mvg-games --pack-destination "$RUNNER_TEMP/packs"
      - name: Upload tarballs to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/packs"/*.tgz --clobber
