<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>音乐宇宙 · Music Video Games — haivivi</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #020208; }
      .uv-boot { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, #071630 0%, #020208 70%); }
      .uv-boot img { width: min(560px, 72vw); filter: drop-shadow(0 0 10px #2cade4) drop-shadow(0 0 34px rgba(44, 173, 228, 0.6)); }
    </style>
  </head>
  <body>
    <div id="universe">
      <div class="uv-boot"><img src="../packages/core/assets/haivivi-wordmark.svg" alt="haivivi" /></div>
    </div>
    <noscript>
      <p style="position: fixed; bottom: 24px; width: 100%; text-align: center; color: #fff; font-family: system-ui">音乐宇宙需要开启 JavaScript · The music universe needs JavaScript</p>
    </noscript>
    <script type="module">
      import { SERIES } from "./catalog.js";
      import { mountUniverse } from "./universe.js";

      window.__universe = mountUniverse("#universe", { series: SERIES });
    </script>
  </body>
</html>
