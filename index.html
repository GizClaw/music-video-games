<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Music Video Games — haivivi</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #020208; color: #fff; font-family: "Avenir Next", "PingFang SC", system-ui, sans-serif; }
      main { max-width: 960px; margin: 0 auto; padding: 56px 24px 80px; }
      .kicker { font: 600 13px Menlo, monospace; letter-spacing: 4px; color: #2cade4; }
      h1 { font: 800 clamp(40px, 7vw, 72px) / 1 "Avenir Next Condensed", "Avenir Next", system-ui, sans-serif; margin: 14px 0 10px; }
      p.lead { opacity: 0.75; max-width: 620px; line-height: 1.6; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; margin-top: 40px; }
      a.card { position: relative; display: block; padding: 26px 24px; border-radius: 18px; color: inherit; text-decoration: none; background: #0b0c1d; border: 1px solid rgba(255,255,255,0.08); overflow: hidden; transition: transform 0.15s, border-color 0.15s; }
      a.card:hover { transform: translateY(-3px); border-color: rgba(255,255,255,0.3); }
      a.card::before { content: ""; position: absolute; inset: 0; opacity: 0.35; background: var(--art); }
      .card > * { position: relative; }
      .card .no { font: 600 12px Menlo, monospace; letter-spacing: 3px; opacity: 0.7; }
      .card h2 { font: 800 30px / 1.05 "Avenir Next Condensed", "Avenir Next", system-ui, sans-serif; margin: 10px 0 8px; }
      .card p { margin: 0; opacity: 0.8; font-size: 15px; line-height: 1.5; }
      .card .play { display: inline-block; margin-top: 18px; padding: 8px 20px; border-radius: 999px; background: #fff; color: #020208; font-weight: 800; letter-spacing: 1px; }
      footer { margin-top: 64px; opacity: 0.5; font-size: 13px; }
      footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main>
      <div class="kicker">HAIVIVI · STEM INSTITUTE</div>
      <h1>Music Video Games</h1>
      <p class="lead">把 STEM Institute 的歌做成能玩的节奏游戏。每个游戏都跟着原曲的节拍、鼓点和歌词同步，视觉来自同一首歌的音乐视频。</p>
      <div class="grid">
        <a class="card" href="aigc/songs/music/stem-institute/en-us/spectrum-slide/game/" style="--art: radial-gradient(circle at 70% 20%, #9b5cff, transparent 55%), radial-gradient(circle at 20% 90%, #ff3d7f, transparent 50%), radial-gradient(circle at 90% 90%, #3de8ff, transparent 45%)">
          <div class="no">No. 15 · 电磁波谱</div>
          <h2>Slide Down<br />the Spectrum</h2>
          <p>在光环隧道里滑动，接住每一拍的光子，从 γ 闸门的缺口钻过去。</p>
          <span class="play">开始玩</span>
        </a>
      </div>
      <footer>源码：<a href="https://github.com/GizClaw/music-video-games">github.com/GizClaw/music-video-games</a> · BSD-3-Clause</footer>
    </main>
  </body>
</html>
