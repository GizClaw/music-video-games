<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>music video renderer — haivivi</title>
    <style>
      html, body { margin: 0; background: #000; color: #fff; font-family: Menlo, monospace; }
      #wrap { width: 1080px; height: 1920px; }
      body.preview #wrap { width: auto; height: 92vh; aspect-ratio: 9 / 16; margin: 1vh auto 0; }
      body.preview #stage { width: 100% !important; height: 100% !important; }
      #ui { display: flex; gap: 12px; align-items: center; justify-content: center; height: 6vh; }
      #ui input { width: 50vw; }
    </style>
    <script type="importmap">
      { "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/", "@gizclaw/mvg-core/": "/packages/core/src/" } }
    </script>
  </head>
  <body>
    <div id="wrap"></div>
    <div id="ui" hidden>
      <button id="play">play / pause</button>
      <input id="seek" type="range" min="0" step="0.01" value="0" />
      <span id="time">0.00</span>
    </div>
    <script>
      if (new URLSearchParams(location.search).has("preview")) document.body.classList.add("preview");
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
